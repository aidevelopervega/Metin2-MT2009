# Rev 51: Exclusive Lua 5.5.1 engine, 64-bit ELF64 qc, 202 active quests (202 state tables, 6,900 object files) & full FreeBSD 15.1 serverfiles verification
name: FreeBSD 15.1 amd64 GCC 14 Verification


on:
  push:
    branches:
      - dev/windows-gcc-baseline
    paths:
      - 'ci/run-full-freebsd.txt'

permissions:
  contents: read

concurrency:
  group: freebsd-gcc-test-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freebsd-gcc14-matrix:
    name: FreeBSD 15.1 - ${{ matrix.engine_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine_id: "mariadb123"
            engine_name: "MariaDB 12.3 LTS"
            server_pkg: "mariadb123-server"
            port_name: "databases/mariadb123-server"
            port: 3307

    steps:
      - name: Check out complete repository tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Cache FreeBSD 15.1 GCC 14 ccache and Crypto++ Static Library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.0
        with:
          path: |
            .ccache-freebsd
            extern/server/cryptopp/libcryptopp.a
          key: freebsd151-gcc14-${{ matrix.engine_id }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'extern/server/cryptopp/**', 'server/src/**') }}
          restore-keys: |
            freebsd151-gcc14-${{ matrix.engine_id }}-
            freebsd151-gcc14-

      - name: Run Metin2 Test Suite in FreeBSD 15.1 VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          copyback: true
          disable-cache: true
          token: ''
          prepare: |
            pkg install -y gcc14 ccache gmake cmake ninja boost-libs devil cryptopp || pkg install -y gcc14 ccache gmake cmake ninja boost-libs || pkg install -y gcc14 gmake cmake ninja boost-libs
            pkg install -y python3 || pkg install -y python311 || true
          run: |
            # 1. İşletim Sistemi ve Mimari Doğrulaması
            OS_NAME=$(uname -s)
            ARCH_NAME=$(uname -m)
            FB_VER=$(freebsd-version 2>/dev/null || uname -r)

            echo "=== SISTEM VE MIMARI DOGRULAMASI ==="
            echo "OS: $OS_NAME"
            echo "Mimari: $ARCH_NAME"
            echo "FreeBSD Sürümü: $FB_VER"

            if [ "$OS_NAME" != "FreeBSD" ]; then
              echo "HATA: Beklenen işletim sistemi FreeBSD, tespit edilen: $OS_NAME" >&2
              exit 1
            fi

            if [ "$ARCH_NAME" != "amd64" ] && [ "$ARCH_NAME" != "x86_64" ]; then
              echo "HATA: Beklenen mimari amd64 (x86_64), tespit edilen: $ARCH_NAME" >&2
              exit 1
            fi

            # 2. GCC 14 Doğrulaması ve Clang Engelleme
            if [ ! -x "/usr/local/bin/g++14" ]; then
              echo "HATA: /usr/local/bin/g++14 bulunamadı!" >&2
              exit 1
            fi

            export CXX=/usr/local/bin/g++14
            export CC=/usr/local/bin/gcc14

            if ! $CXX --version | grep -qi "Free Software Foundation"; then
              echo "HATA: $CXX gerçek FSF GCC değil (Clang tespit edildi)!" >&2
              exit 1
            fi

            echo "=== DERLEYICI DOGRULAMASI ==="
            echo "C++ Derleyicisi: $CXX"
            $CXX --version
            if command -v python3 >/dev/null 2>&1; then
              echo "=== PYTHON SURUMU VE VARSAYILAN KODLAMA DOGRULAMASI ==="
              python3 --version
              python3 -c 'import sys, locale; print("defaultencoding=" + sys.getdefaultencoding(), "preferredencoding=" + locale.getpreferredencoding(False), "filesystemencoding=" + sys.getfilesystemencoding())'
            fi
            if [ -d "extern/server/include/mysql/server" ]; then
              echo "HATA: Temiz checkout icinde kullanilmayan extern/server/include/mysql/server dizini tespit edildi!" >&2
              exit 1
            fi

            # 3. Test Betiğinin Çalıştırılması (290 Modül Testi)
            chmod +x ./tests/run_tests.sh
            ./tests/run_tests.sh

            # 4. FreeBSD 15.1 PKG Deposu, ABI ve Ports Durumu İncelemesi
            echo "=== FREEBSD 15.1 PKG VE REPOSITORY DENETIMI ==="
            pkg -vv || true
            PKG_ABI=$(pkg config ABI 2>/dev/null || uname -m)
            echo "PKG ABI: $PKG_ABI"

            export PATH="/usr/local/bin:/usr/local/sbin:/usr/local/libexec:$PATH"
            chmod +x ./tests/run_live_tests.sh

            ENGINE_ID="${{ matrix.engine_id }}"
            SERVER_PKG="${{ matrix.server_pkg }}"
            PORT_NAME="${{ matrix.port_name }}"
            ENGINE_NAME="${{ matrix.engine_name }}"
            PORT_NUM="${{ matrix.port }}"

            echo "=== HEDEF MOTOR: $ENGINE_NAME ==="
            echo "Port Yolu: $PORT_NAME"
            echo "Paket Adı: $SERVER_PKG"

            # İkili (binary) paket kurulumu dene
            if ! pkg install -y "$SERVER_PKG"; then
              echo "=================================================="
              echo " [HATA] $SERVER_PKG FreeBSD 15.1 ($PKG_ABI) resmi ikili (binary) pkg deposunda kurulamadı!"
              echo " pkg search Çıktısı:"
              pkg search -x "^$SERVER_PKG" || true
              echo " Durum: $ENGINE_NAME -> FAIL-CLOSED (Zorunlu paket kurulamadığı için test koşulamadı)"
              echo "=================================================="
              exit 1
            fi

            echo "--> $SERVER_PKG paketi başarıyla kuruldu!"
            pkg info | grep -E 'gcc14|mariadb|mysql' || true

            # 5. FreeBSD amd64 Gerçek 64-Bit Sunucu Kütüphaneleri Derlemesi (ccache + libcryptopp.a önbellek destekli)
            echo "=== FREEBSD 15.1 amd64 GERCEK SUNUCU KUTUPHANELERI DERLEMESI ==="
            export CCACHE_DIR="$PWD/.ccache-freebsd"
            export CCACHE_MAXSIZE="512M"
            export CCACHE_COMPRESS="true"
            GMAKE_CXX="/usr/local/bin/g++14"
            GMAKE_CC="/usr/local/bin/gcc14"
            CMAKE_CCACHE_ARGS=""
            if command -v ccache >/dev/null 2>&1; then
              mkdir -p "$CCACHE_DIR"
              ccache -z || true
              GMAKE_CXX="ccache /usr/local/bin/g++14"
              GMAKE_CC="ccache /usr/local/bin/gcc14"
              CMAKE_CCACHE_ARGS="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache"
            fi
            gmake -C server/src/libthecore/src -j4 CXX="$GMAKE_CXX" CC="$GMAKE_CC"
            gmake -C server/src/libpoly -j4 CXX="$GMAKE_CXX" CC="$GMAKE_CC"
            gmake -C server/src/libsql clean
            gmake -C server/src/libsql -j4 CXX="$GMAKE_CXX" CC="$GMAKE_CC"
            gmake -C server/src/libgame/src -j4 CXX="$GMAKE_CXX" CC="$GMAKE_CC"
            LUA55_DIR="server/src/liblua/5.5/src"
            gmake -C "$LUA55_DIR" a CC="$GMAKE_CC" AR="ar rcu" RANLIB="ranlib"
            echo "=== FREEBSD 15.1 amd64 GERCEK CRYPTOPP DERLEMESI ==="
            CRYPTOPP_DIR="extern/server/cryptopp"
            if [ -f "$CRYPTOPP_DIR/libcryptopp.a" ] && file "$CRYPTOPP_DIR/libcryptopp.a" | grep -q "current ar archive"; then
              echo "--> Önbellekten doğrulanan $CRYPTOPP_DIR/libcryptopp.a kullanılıyor."
            else
              gmake -C "$CRYPTOPP_DIR" -j4 static CXX="$GMAKE_CXX" CC="$GMAKE_CC"
            fi
            ls -lh server/src/libthecore/lib/libthecore.a server/src/libpoly/libpoly.a server/src/libsql/libsql.a server/src/libgame/lib/libgame.a "$LUA55_DIR"/liblua.a "$CRYPTOPP_DIR"/libcryptopp.a
            file server/src/libthecore/lib/libthecore.a server/src/libpoly/libpoly.a server/src/libsql/libsql.a server/src/libgame/lib/libgame.a "$LUA55_DIR"/liblua.a "$CRYPTOPP_DIR"/libcryptopp.a

            # 5.1 FreeBSD amd64 Gerçek 64-Bit DB Sunucusu Derlemesi
            echo "=== FREEBSD 15.1 amd64 GERCEK DB SUNUCUSU DERLEMESI ==="
            DB_DIR="server/src/db"
            gmake -C "$DB_DIR/src" -j4 CXX="$GMAKE_CXX" CC="$GMAKE_CC"
            ls -lh "$DB_DIR"
            file "$DB_DIR"/db_r* || true

            # 5.2 FreeBSD DB Cache ve ACK Entegrasyon Testi (Gerçek ClientManager ve DB nesneleri)
            echo "=== FREEBSD DB CACHE / ACK ENTEGRASYON TESTI ==="
            chmod +x ./tests/run_db_integration_tests.sh
            ./tests/run_db_integration_tests.sh

            # 5.3 FreeBSD amd64 CMake + Ninja Derleme (db_r41023, game_r41023 [Lua 5.5.1 Exclusive], qc [Lua 5.5.1 Exclusive]) ve CTest Doğrulaması
            echo "=== FREEBSD 15.1 amd64 CMAKE + NINJA DERLEMESI VE CTEST ==="
            GAME_DIR="server/src/game"
            QC_BIN="build/freebsd-gcc14/server/src/game/src/quest/qc"
            rm -f "$DB_DIR/db_r41023" "$GAME_DIR/game_r41023" "$QC_BIN"
            cmake --preset freebsd-gcc14 $CMAKE_CCACHE_ARGS
            cmake --build --preset freebsd-gcc14 -- -j2
            if command -v ccache >/dev/null 2>&1; then
              ccache -s || true
            fi
            ctest --preset freebsd-gcc14 --output-on-failure
            ls -lh "$DB_DIR/db_r41023" "$GAME_DIR/game_r41023" "$QC_BIN"
            file "$DB_DIR/db_r41023" "$GAME_DIR/game_r41023" "$QC_BIN"
            readelf -h "$DB_DIR/db_r41023" "$GAME_DIR/game_r41023" "$QC_BIN" | grep -E 'Class|Machine|Type' || true
            readelf -d "$DB_DIR/db_r41023" "$GAME_DIR/game_r41023" "$QC_BIN" | grep -E 'NEEDED|RPATH|RUNPATH' || true
            if readelf -d "$DB_DIR/db_r41023" "$GAME_DIR/game_r41023" "$QC_BIN" | grep -q "libc++.so"; then
              echo "HATA: CMake ikililerinde istenmeyen libc++.so bagimliligi tespit edildi (cift C++ runtime tehlikesi)!" >&2
              exit 1
            fi
            if readelf -d "$DB_DIR/db_r41023" "$GAME_DIR/game_r41023" | grep -q "libmysqlclient"; then
              echo "HATA: CMake ikililerinde istenmeyen libmysqlclient bagimliligi tespit edildi!" >&2
              exit 1
            fi
            echo "--> CMake ikilileri (db_r41023, game_r41023 [Lua 5.5.1 Exclusive], qc [Lua 5.5.1 Exclusive]) ELF64 pure libstdc++ ve libmariadb olarak basariyla dogrulandi."

            # 5.4 Game Sunucusu Lua 5.5.1 Quest Runtime Doğrulaması (--check-lua 11/11)
            echo "=== GAME SUNUCUSU LUA 5.5.1 QUEST RUNTIME DOGRULAMASI (--check-lua) ==="
            "$GAME_DIR/game_r41023" --check-lua | tee /tmp/check_lua_default.log
            if ! grep -q "Lua 5.5.1" /tmp/check_lua_default.log; then
              echo "HATA: game_r41023 ikilisi Lua 5.5.1 motoru ile calismiyor!" >&2
              exit 1
            fi
            echo "--> CMake + Ninja derleme, ELF64, pure libstdc++, CTest (10/10) ve --check-lua (11/11: Lua 5.5.1 Exclusive) doğrulaması başarıyla tamamlandı."

            DATA_DIR="/tmp/data_${ENGINE_ID}"
            SSL_DIR="/tmp/ssl_${ENGINE_ID}"
            mkdir -p "$DATA_DIR" "$SSL_DIR"

            # Test CA ve Sunucu Sertifikaları Oluşturma
            echo "--> Test TLS CA ve Sunucu Sertifikaları Üretiliyor..."
            openssl req -x509 -newkey rsa:2048 -nodes -keyout "$SSL_DIR/ca-key.pem" -out "$SSL_DIR/ca-cert.pem" -days 365 -subj "/CN=Metin2 Test CA"
            openssl req -newkey rsa:2048 -nodes -keyout "$SSL_DIR/server-key.pem" -out "$SSL_DIR/server-req.pem" -subj "/CN=127.0.0.1"
            openssl x509 -req -in "$SSL_DIR/server-req.pem" -CA "$SSL_DIR/ca-cert.pem" -CAkey "$SSL_DIR/ca-key.pem" -CAcreateserial -out "$SSL_DIR/server-cert.pem" -days 365
            openssl req -x509 -newkey rsa:2048 -nodes -keyout "$SSL_DIR/invalid-ca-key.pem" -out "$SSL_DIR/invalid-ca-cert.pem" -days 365 -subj "/CN=Untrusted Fake CA"
            # FreeBSD üzerinde veritabanı servisleri 'mysql' kullanıcısı ile çalışır
            chown -R mysql:mysql "$DATA_DIR" "$SSL_DIR"
            chmod 750 "$DATA_DIR" "$SSL_DIR"
            chmod 644 "$SSL_DIR"/*-cert.pem "$SSL_DIR"/*-req.pem
            chmod 640 "$SSL_DIR"/*-key.pem

            TEST_DB_PASS=$(openssl rand -hex 12)
            RUNTIME_DB_PASS=$(openssl rand -hex 12)
            LOG_DB_PASS=$(openssl rand -hex 12)
            BACKUP_DB_PASS=$(openssl rand -hex 12)

            # Motor Sürecini Başlatma
            SOCKET_PATH="/tmp/${ENGINE_ID}.sock"
            if [ "$ENGINE_ID" = "mariadb123" ]; then
              mariadb-install-db --user=mysql --datadir="$DATA_DIR" --basedir=/usr/local --auth-root-authentication-method=normal >/tmp/install_${ENGINE_ID}.log 2>&1 || true
              MARIADBD=$(which mariadbd 2>/dev/null || ls /usr/local/libexec/mariadbd 2>/dev/null || ls /usr/local/sbin/mariadbd 2>/dev/null)
              echo "MariaDB Daemon: $MARIADBD"
              AUDIT_ARGS=""
              if [ -f "/usr/local/lib/mysql/plugin/server_audit.so" ]; then
                AUDIT_ARGS="--plugin-load-add=server_audit.so --server-audit=FORCE_PLUS_PERMANENT --server-audit-events=CONNECT,QUERY_DDL,QUERY_DCL,QUERY_DML_NO_SELECT --server-audit-output-type=FILE --server-audit-file-path=$DATA_DIR/mariadb_audit.log --server-audit-file-rotate-size=104857600 --server-audit-file-rotations=90 --server-audit-logging=ON"
              fi
              "$MARIADBD" --user=mysql --datadir="$DATA_DIR" --socket="$SOCKET_PATH" --port=$PORT_NUM --bind-address=127.0.0.1 \
                  --local-infile=0 --symbolic-links=0 $AUDIT_ARGS \
                  --ssl-ca="$SSL_DIR/ca-cert.pem" --ssl-cert="$SSL_DIR/server-cert.pem" --ssl-key="$SSL_DIR/server-key.pem" >/tmp/server_${ENGINE_ID}.log 2>&1 &
              SERVER_PID=$!

              echo "MariaDB sunucusunun hazır olması bekleniyor (Port $PORT_NUM)..."
              for i in $(seq 1 30); do
                if mariadb-admin --socket="$SOCKET_PATH" ping --silent 2>/dev/null; then
                  echo "Sunucu $i saniyede hazır oldu."
                  break
                fi
                sleep 1
              done

              if ! mariadb-admin --socket="$SOCKET_PATH" ping --silent 2>/dev/null; then
                echo "HATA: MariaDB başlatılamadı! Kurulum ve sunucu log çıktısı:"
                cat /tmp/install_${ENGINE_ID}.log || true
                cat /tmp/server_${ENGINE_ID}.log || true
                exit 1
              fi

              mariadb --socket="$SOCKET_PATH" -u root -e "
                CREATE DATABASE IF NOT EXISTS mt2_testdb;
                CREATE DATABASE IF NOT EXISTS account CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
                CREATE DATABASE IF NOT EXISTS common CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
                CREATE DATABASE IF NOT EXISTS log CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
                CREATE DATABASE IF NOT EXISTS player CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
                CREATE DATABASE IF NOT EXISTS world CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
                CREATE USER IF NOT EXISTS 'mt2test'@'127.0.0.1' IDENTIFIED BY '${TEST_DB_PASS}';
                CREATE USER IF NOT EXISTS 'mt2test'@'localhost' IDENTIFIED BY '${TEST_DB_PASS}';
                GRANT CREATE, ALTER, DROP, INDEX, LOCK TABLES, SELECT, INSERT, UPDATE, DELETE ON mt2_testdb.* TO 'mt2test'@'127.0.0.1';
                GRANT CREATE, ALTER, DROP, INDEX, LOCK TABLES, SELECT, INSERT, UPDATE, DELETE ON mt2_testdb.* TO 'mt2test'@'localhost';
                GRANT CREATE, ALTER, DROP, INDEX, LOCK TABLES, SELECT, INSERT, UPDATE, DELETE ON account.* TO 'mt2test'@'127.0.0.1';
                GRANT CREATE, ALTER, DROP, INDEX, LOCK TABLES, SELECT, INSERT, UPDATE, DELETE ON account.* TO 'mt2test'@'localhost';
                GRANT CREATE, ALTER, DROP, INDEX, LOCK TABLES, SELECT, INSERT, UPDATE, DELETE ON common.* TO 'mt2test'@'127.0.0.1';
                GRANT CREATE, ALTER, DROP, INDEX, LOCK TABLES, SELECT, INSERT, UPDATE, DELETE ON common.* TO 'mt2test'@'localhost';
                GRANT CREATE, ALTER, DROP, INDEX, LOCK TABLES, SELECT, INSERT, UPDATE, DELETE ON log.* TO 'mt2test'@'127.0.0.1';
                GRANT CREATE, ALTER, DROP, INDEX, LOCK TABLES, SELECT, INSERT, UPDATE, DELETE ON log.* TO 'mt2test'@'localhost';
                GRANT CREATE, ALTER, DROP, INDEX, LOCK TABLES, SELECT, INSERT, UPDATE, DELETE ON player.* TO 'mt2test'@'127.0.0.1';
                GRANT CREATE, ALTER, DROP, INDEX, LOCK TABLES, SELECT, INSERT, UPDATE, DELETE ON player.* TO 'mt2test'@'localhost';
                GRANT CREATE, ALTER, DROP, INDEX, LOCK TABLES, SELECT, INSERT, UPDATE, DELETE ON world.* TO 'mt2test'@'127.0.0.1';
                GRANT CREATE, ALTER, DROP, INDEX, LOCK TABLES, SELECT, INSERT, UPDATE, DELETE ON world.* TO 'mt2test'@'localhost';
                CREATE USER IF NOT EXISTS 'mt2server'@'127.0.0.1' IDENTIFIED BY '${RUNTIME_DB_PASS}';
                CREATE USER IF NOT EXISTS 'mt2server'@'localhost' IDENTIFIED BY '${RUNTIME_DB_PASS}';
                GRANT SELECT, INSERT, UPDATE, DELETE ON mt2_testdb.* TO 'mt2server'@'127.0.0.1';
                GRANT SELECT, INSERT, UPDATE, DELETE ON mt2_testdb.* TO 'mt2server'@'localhost';
                GRANT SELECT, INSERT, UPDATE, DELETE ON account.* TO 'mt2server'@'127.0.0.1';
                GRANT SELECT, INSERT, UPDATE, DELETE ON account.* TO 'mt2server'@'localhost';
                GRANT SELECT, INSERT, UPDATE, DELETE ON common.* TO 'mt2server'@'127.0.0.1';
                GRANT SELECT, INSERT, UPDATE, DELETE ON common.* TO 'mt2server'@'localhost';
                GRANT SELECT, INSERT, UPDATE, DELETE ON player.* TO 'mt2server'@'127.0.0.1';
                GRANT SELECT, INSERT, UPDATE, DELETE ON player.* TO 'mt2server'@'localhost';
                GRANT SELECT ON world.* TO 'mt2server'@'127.0.0.1';
                GRANT SELECT ON world.* TO 'mt2server'@'localhost';
                CREATE USER IF NOT EXISTS 'mt2log'@'127.0.0.1' IDENTIFIED BY '${LOG_DB_PASS}';
                CREATE USER IF NOT EXISTS 'mt2log'@'localhost' IDENTIFIED BY '${LOG_DB_PASS}';
                GRANT SELECT, INSERT, UPDATE, DELETE ON log.* TO 'mt2log'@'127.0.0.1';
                GRANT SELECT, INSERT, UPDATE, DELETE ON log.* TO 'mt2log'@'localhost';
                CREATE USER IF NOT EXISTS 'mt2backup'@'127.0.0.1' IDENTIFIED BY '${BACKUP_DB_PASS}';
                CREATE USER IF NOT EXISTS 'mt2backup'@'localhost' IDENTIFIED BY '${BACKUP_DB_PASS}';
                GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT ON mt2_testdb.* TO 'mt2backup'@'127.0.0.1';
                GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT ON mt2_testdb.* TO 'mt2backup'@'localhost';
                GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT ON account.* TO 'mt2backup'@'127.0.0.1';
                GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT ON account.* TO 'mt2backup'@'localhost';
                GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT ON common.* TO 'mt2backup'@'127.0.0.1';
                GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT ON common.* TO 'mt2backup'@'localhost';
                GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT ON log.* TO 'mt2backup'@'127.0.0.1';
                GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT ON log.* TO 'mt2backup'@'localhost';
                GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT ON player.* TO 'mt2backup'@'127.0.0.1';
                GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT ON player.* TO 'mt2backup'@'localhost';
                GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT ON world.* TO 'mt2backup'@'127.0.0.1';
                GRANT SELECT, SHOW VIEW, TRIGGER, LOCK TABLES, EVENT ON world.* TO 'mt2backup'@'localhost';
                FLUSH PRIVILEGES;
              "
            fi

            # Canlı Testi Çalıştırma
            export MT2_TEST_HOST=127.0.0.1
            export MT2_TEST_PORT=$PORT_NUM
            export MT2_TEST_USER=mt2test
            export MT2_TEST_PASSWORD="$TEST_DB_PASS"
            export MT2_RUNTIME_USER=mt2server
            export MT2_RUNTIME_PASSWORD="$RUNTIME_DB_PASS"
            export MT2_LOG_DB_USER=mt2log
            export MT2_LOG_DB_PASS="$LOG_DB_PASS"
            export MT2_BACKUP_DB_USER=mt2backup
            export MT2_BACKUP_DB_PASS="$BACKUP_DB_PASS"
            export MT2_TEST_DB=mt2_testdb
            export MT2_TEST_ENGINE="FreeBSD $ENGINE_NAME"
            export MT2_TEST_SSL_CA="$SSL_DIR/ca-cert.pem"
            export MT2_TEST_INVALID_SSL_CA="$SSL_DIR/invalid-ca-cert.pem"

            ./tests/run_live_tests.sh

            # İzole Sunucu Başlatma (db_r41023 + game_r41023 [Lua 5.5.1 Exclusive]) ve 32-Bit İstemci El Sıkışma Duman Testi
            chmod +x ./tests/run_server_smoke_test.sh
            ./tests/run_server_smoke_test.sh

            # Rev 51: Gerçek FreeBSD 15.1 Serverfiles (/usr/home/mt2) Lua 5.5.1 Exclusive + 202 Quest, 8 Servis (db, auth, ch11..ch01), Least-Privilege SQL, chmod 600, Cross-Core Warp ve Log Rotation Doğrulaması
            chmod +x ./tests/run_freebsd_serverfiles_test.sh
            ENGINE_ID="$ENGINE_ID" ./tests/run_freebsd_serverfiles_test.sh

            # Sunucuyu Temiz Kapatma ve copyback Öncesi Ağır Derleme Çıktılarını Temizleme
            kill $SERVER_PID || true
            wait $SERVER_PID 2>/dev/null || true
            rm -rf build tests/build \
              server/src/db/db_r* server/src/db/src/.obj \
              server/src/game/game_r* \
              server/src/libthecore/lib server/src/libthecore/src/*.o \
              server/src/libpoly/libpoly.a server/src/libpoly/*.o \
              server/src/libsql/libsql.a server/src/libsql/*.o \
              server/src/libgame/lib server/src/libgame/src/*.o \
              server/src/liblua/5.5/src/liblua.a server/src/liblua/5.5/src/*.o \
              extern/server/cryptopp/*.o
            echo "--> $ENGINE_NAME sunucusu temiz şekilde kapatıldı ve serverfiles logları artifacts/ dizinine hazırlandı."

      - name: Upload FreeBSD Serverfiles Logs (syserr, syslog, status)
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: freebsd-serverfiles-logs-${{ matrix.engine_id }}
          path: artifacts/freebsd_serverfiles_logs_${{ matrix.engine_id }}/
          if-no-files-found: warn
